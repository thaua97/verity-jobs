<div class="p-6 w-[500px] max-w-full h-[350px]">
  <h2 class="text-lg font-semibold mb-2 flex items-center gap-2 text-slate-800">
    <mat-icon class="text-red-600">warning</mat-icon>
    {{ data.title || 'Confirmar exclusão' }}
  </h2>
	<figure class="flex justify-center items-center">
		<img class="w-[145px] h-[145px]" [src]="data.illustration || 'images/delete.svg'" alt="deletar">
	</figure>
  <p class="text-slate-600 mb-6 text-center text-lg">
    {{ data.message || 'Tem certeza que deseja prosseguir com esta ação?' }}
  </p>
  <div class="flex justify-center gap-3">
    <button mat-button class="!text-red-500 !bg-red-100 hover:bg-red-400 !p-4 !rounded-[8px]" (click)="onCancel()">
      {{ data.cancelText || 'Cancelar' }}
    </button>
    <button mat-flat-button class="!py-4 !px-6 !rounded-[8px] !text-white !bg-indigo-600" (click)="onConfirm()">
      {{ data.confirmText || 'Excluir' }}
    </button>
  </div>
</div>
