<header class="w-full h-16 bg-slate-50 border-b border-slate-200 py-2 px-[16px] md:px-[24px] lg:px-[10%]">
    <div class="flex justify-between items-center">
        <h1 class="text-indigo-600 font-bold text-2xl">VerityJobs</h1>
        <ul class="flex gap-2">
            <li class="text-indigo-600 font-bold">
                <button mat-button routerLink="/">{{ 'header.home' | transloco }}</button>
            </li>
            <li class="text-indigo-600 font-bold">
                <button mat-button routerLink="/resumes">{{ 'header.resume' | transloco }}</button>
            </li>
            <li>
                <button class="!rounded-[8px]" matButton="outlined" [matMenuTriggerFor]="menu">{{ selectedLanguage() }}</button>
            </li>
        </ul>
    </div>
    <mat-menu #menu="matMenu">
        @for (language of languages(); track $index) {
            <button mat-menu-item (click)="changeLanguage(language.value)">{{ 'header.language.' + language.value | transloco }}</button>
        }
    </mat-menu>
</header>
