<mat-list-item class="!w-full !h-full !bg-indigo-50 !py-6 !px-4">
	<div class="w-full h-full !flex !items-center !justify-between gap-4">
		<div class="!w-[164px] !h-[100px] !rounded-[8px] !bg-indigo-200 flex items-center justify-center" >
			<span class="text-2xl font-bold text-indigo-700">{{ initials }}</span>
		</div>
		<article class="!w-full !flex flex-col !items-start !justify-between gap-2">
			<div matListItemTitle class="font-semibold text-indigo-700 text-xl">{{ name }}</div>
			<div matListItemLine class="flex items-start gap-2 flex-col">
				<span class="text-slate-500">{{ ocupation }}</span>
				<span class="text-indigo-700 bg-indigo-200 px-2 py-1 rounded-[4px]">{{ salary }}</span>
			</div>
		</article>
		<div class="flex items-center gap-2">
			<button
				mat-icon-button
				class="!bg-indigo-200 !text-indigo-600 !hover:bg-indigo-400 transition-all !duration-300 !rounded-[8px]"
				[routerLink]="`/resumes/${resumeId}/candidate`"
			>
				<mat-icon>visibility</mat-icon>
			</button>
			<button
				mat-icon-button
				class="!bg-red-200 !text-red-600 !hover:bg-red-400 transition-all !duration-300 !rounded-[8px]"
				(click)="deleteResume(resumeId)"
			>
				<mat-icon>delete</mat-icon>
			</button>
		</div>
	</div>
</mat-list-item>
