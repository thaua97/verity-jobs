@if(resumes().length > 0) {
<mat-list class="!w-full !h-full !flex !flex-col !flex-1 !gap-2 !overflow-y-auto">
	@for(resume of resumes(); track resume.id) {
	<app-resume-list-item
		[resumeId]="resume.id ?? ''"
		[name]="resume.name"
		[ocupation]="resume.ocupation"
		[salary]="resume.salary"
		(delete)="deleteResume($event)"
	></app-resume-list-item>
	}
</mat-list>
} @else {
<article class="flex flex-col items-center justify-center h-full gap-6">
	<img class="w-[200px] h-[200px]" src="images/no-content.svg" alt="Nenhum registro encontrado" />
	<h3 class="text-2xl text-slate-500 font-bold">{{ 'noCandidates.title' | transloco }}</h3>
	<p class="text-slate-500">{{ 'noCandidates.description' | transloco }}</p>
	<button
		mat-button
		class="!w-full !py-4 !px-6 !rounded-[8px] !text-white !bg-indigo-600"
		routerLink="/"
	>
		{{ 'noCandidates.button' | transloco }}
	</button>
</article>
}
