<section class="h-full w-full flex flex-col justify-center items-center md:px-6 lg:px-[10%]">
	<div class="flex flex-col justify-center items-center w-full h-full">
		<section class="w-full h-full flex flex-col gap-6 p-2 md:px-6 lg:px-[10%]">
			<div class="flex w-full gap-4 mb-4">
				@for (step of steps(); track $index) {
				<span
					class="h-[8px] rounded transition-all duration-200"
					[class.w-full]="stepsCount <= 3"
					[class.w-[33%]]="stepsCount === 3"
					[class.bg-indigo-600]="currentStepNumber + 1 >= step"
					[class.bg-indigo-200]="currentStepNumber + 1 < step"
				></span>
				}
			</div>
			@switch (currentStepNumber) {
				@case (0) {
					<app-step-identification></app-step-identification>
				} @case (1) {
					<app-step-location></app-step-location>
				} @case (2) {
					<app-step-ocupation></app-step-ocupation>
				}
			}
			<div class="w-full flex justify-center items-center gap-[16px]">
				@if (currentStepNumber > 0) {
				<button
					mat-button
					class="w-full flex row-reverse !p-auto !text-indigo-600 !bg-gray-200 font-bold !rounded-[8px]"
					(click)="previous()"
					[disabled]="currentStepNumber === 0"
				>
					<mat-icon>arrow_back</mat-icon>
					Anterior
				</button>
				} @if (currentStepNumber < stepsCount - 1) {
				<button
					mat-button
					class="w-full !p-auto !text-indigo-600 !bg-gray-200 font-bold !rounded-[8px]"
					[class.!text-indigo-100]="!isCurrentStepValid()"
					(click)="next()"
					[disabled]="currentStepNumber === stepsCount - 1 || !isCurrentStepValid()"
				>
					Próximo
					<mat-icon iconPositionEnd>arrow_forward</mat-icon>
				</button>
				} @else {
				<button
					mat-button
					class="w-full !p-auto !text-indigo-600 !bg-gray-200 !hover:!bg-indigo-400 font-bold !rounded-[8px]"
					(click)="submit()"
					[disabled]="!isCurrentStepValid()"
				>
					Concluir
					<mat-icon iconPositionEnd>check</mat-icon>
				</button>
				}
			</div>
		</section>
	</div>
</section>
