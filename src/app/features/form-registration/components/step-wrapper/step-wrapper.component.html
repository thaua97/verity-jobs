<div class="flex flex-col justify-center items-center w-full h-full">
    <section class="w-full h-full rounded-2xl  p-2">
      <ng-content></ng-content>
    </section>
    <div class="step-controls">
        <button (click)="previous()" [disabled]="currentStep === 0">Anterior</button>
        <span>Step {{ currentStep + 1 }} de {{ stepsCount }}</span>
        <button (click)="next()" [disabled]="currentStep === stepsCount - 1">Próximo</button>
    </div>
</div>
